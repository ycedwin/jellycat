<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A personal Jellycat stock catalog.">
  <title>My Jellycat Shelf</title>
  <style>
    :root {
      --ink: #15364a;
      --muted: #65747c;
      --cream: #f8f5ee;
      --paper: #fffdf8;
      --pink: #efc6d0;
      --pink-light: #f8e9ec;
      --green: #dce9d8;
      --green-ink: #365d3c;
      --line: #dedbd3;
      --shadow: 0 12px 32px rgb(21 54 74 / 8%);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--cream);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select { font: inherit; }
    a { color: inherit; }
    [hidden] { display: none !important; }

    .announcement {
      padding: .45rem 1rem;
      background: var(--ink);
      color: white;
      text-align: center;
      font-size: .68rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    header {
      position: relative;
      overflow: hidden;
      padding: 3.2rem 1.25rem 3rem;
      text-align: center;
      color: var(--ink);
      border-bottom: 1px solid var(--line);
      background:
        url("https://cdn11.bigcommerce.com/s-23s5gfmhr7/images/stencil/1920w/image-manager/rooftop-desktop-1270x704.jpg?t=1785197021") center / cover no-repeat;
    }

    header::before,
    header::after { display: none; }

    .eyebrow {
      position: relative;
      margin: 0 0 .8rem;
      color: #a6576b;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .header-stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: .55rem .9rem;
      margin: 1rem auto 0;
      max-width: 40rem;
    }

    .header-stat {
      padding: .35rem .75rem;
      border: 1px solid rgb(255 255 255 / 55%);
      border-radius: 999px;
      background: rgb(255 253 248 / 82%);
      color: var(--ink);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .02em;
      backdrop-filter: blur(4px);
    }

    h1 {
      position: relative;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.3rem, 6vw, 4.2rem);
      font-weight: 400;
      letter-spacing: -.045em;
      line-height: .95;
      color: var(--ink);
      text-shadow: 0 1px 0 rgb(255 253 248 / 70%);
    }

    .intro {
      position: relative;
      max-width: 34rem;
      margin: .8rem auto 0;
      color: var(--muted);
      font-size: .9rem;
      line-height: 1.6;
    }

    main {
      width: min(1280px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 1.5rem 0 4rem;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(13rem, 1fr) auto auto;
      gap: .75rem;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .search-wrap { position: relative; }

    .search-wrap svg {
      position: absolute;
      top: 50%;
      left: 1rem;
      width: 1.1rem;
      transform: translateY(-50%);
      pointer-events: none;
    }

    input, select, .edit-link {
      min-height: 3rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
      color: var(--ink);
    }

    .search-wrap input {
      width: 100%;
      padding: 0 1rem 0 2.8rem;
    }

    select { padding: 0 2.5rem 0 1.1rem; }

    input:focus, select:focus, .edit-link:focus-visible, .official-mark:focus-visible {
      outline: 3px solid rgb(239 198 208 / 65%);
      outline-offset: 2px;
    }

    .edit-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 1.25rem;
      background: var(--pink);
      border-color: var(--pink);
      font-size: .88rem;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .summary {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin: 0 0 1rem;
      color: var(--muted);
      font-size: .88rem;
    }

    .summary strong { color: var(--ink); }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: .9rem;
    }

    .card {
      overflow: hidden;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 1rem;
      box-shadow: var(--shadow);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 38px rgb(21 54 74 / 12%);
    }

    .image-wrap {
      position: relative;
      aspect-ratio: 1;
      overflow: hidden;
      background: #f1eee7;
    }

    .image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      mix-blend-mode: multiply;
      transition: transform 300ms ease;
    }

    .card:hover img { transform: scale(1.025); }

    .badge {
      position: absolute;
      top: .85rem;
      left: .85rem;
      padding: .45rem .75rem;
      border-radius: 999px;
      background: var(--green);
      color: var(--green-ink);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .badge.sold {
      background: #ece8e0;
      color: #746f65;
    }

    .badge.not-in-stock {
      background: #f1e1dc;
      color: #82554a;
    }

    .badge.retired {
      top: auto;
      left: auto;
      bottom: .85rem;
      right: .85rem;
      background: #ece8e0;
      color: #746f65;
    }

    .image-placeholder {
      display: grid;
      width: 100%;
      height: 100%;
      place-items: center;
      padding: 2rem;
      color: #9b9489;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.15rem;
      text-align: center;
    }

    .card-body { padding: .9rem; }

    .sku {
      margin: 0 0 .45rem;
      color: var(--muted);
      font-size: .7rem;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .card h2 {
      flex: 1;
      min-width: 0;
      min-height: 0;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.08rem;
      font-weight: 400;
      line-height: 1.25;
    }

    .title-row {
      display: flex;
      align-items: flex-start;
      gap: .55rem;
      margin: 0 0 .75rem;
    }

    .official-mark {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 1.35rem;
      margin-top: .15rem;
      text-decoration: none;
    }

    .official-mark img {
      display: block;
      height: 1.35rem;
      width: auto;
      max-width: 4.5rem;
      object-fit: contain;
    }

    .official-mark:hover {
      opacity: .75;
    }

    .official-mark:focus-visible {
      outline: 3px solid rgb(239 198 208 / 65%);
      outline-offset: 2px;
    }

    .prices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .5rem;
      padding: .7rem 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .prices.three {
      display: flex;
      align-items: stretch;
      gap: .35rem;
      padding: .65rem 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .prices.three .price-box {
      flex: 1;
      min-width: 0;
      padding: .4rem .3rem;
      border: 1px solid var(--line);
      border-radius: .55rem;
      background: var(--cream);
      text-align: center;
    }

    .price-label {
      display: block;
      margin-bottom: .3rem;
      color: var(--muted);
      font-size: .7rem;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .prices.three .price-label {
      margin-bottom: .15rem;
      font-size: .62rem;
    }

    .price {
      font-size: .85rem;
      font-weight: 700;
    }

    .prices.three .price {
      display: block;
      font-size: .72rem;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty, .error {
      grid-column: 1 / -1;
      padding: 4rem 1rem;
      border: 1px dashed var(--line);
      border-radius: 1.25rem;
      text-align: center;
      color: var(--muted);
    }

    .back-to-top {
      position: fixed;
      right: 1.25rem;
      bottom: 1.25rem;
      z-index: 10;
      width: 3rem;
      height: 3rem;
      border: 0;
      border-radius: 50%;
      background: var(--ink);
      color: white;
      box-shadow: var(--shadow);
      cursor: pointer;
      font-size: 1.3rem;
    }

    .view-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      margin: 0 0 1.5rem;
    }

    .view-tabs {
      display: flex;
      width: fit-content;
      padding: .3rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
    }

    .view-tab {
      padding: .65rem 1.15rem;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-weight: 700;
    }

    .view-tab[aria-selected="true"] {
      background: var(--ink);
      color: white;
    }

    .refresh-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.7rem;
      height: 2.7rem;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
      color: var(--ink);
      cursor: pointer;
    }

    .refresh-button svg {
      width: 1.15rem;
      height: 1.15rem;
    }

    .refresh-button:disabled {
      opacity: .55;
      cursor: wait;
    }

    .refresh-button.is-busy svg {
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .profit-nav,
    .category-nav {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      margin: 0 0 .75rem;
    }

    .profit-chip,
    .category-chip {
      padding: .55rem .9rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
      color: var(--muted);
      cursor: pointer;
      font-size: .78rem;
      font-weight: 700;
    }

    .profit-chip[aria-pressed="true"],
    .category-chip[aria-pressed="true"] {
      background: var(--green);
      border-color: var(--green);
      color: var(--green-ink);
    }

    #official-catalog.grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .card.row {
      display: grid;
      grid-template-columns: 8rem minmax(0, 1fr);
      align-items: stretch;
    }

    .card.row .image-wrap {
      min-height: 8rem;
    }

    .card.row .badge {
      top: .5rem;
      left: .5rem;
      padding: .3rem .5rem;
      font-size: .58rem;
      max-width: calc(100% - 1rem);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card.row .badge.retired {
      top: auto;
      left: auto;
      bottom: .5rem;
      right: .5rem;
    }

    .card.row .card-body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: .35rem;
      padding: .7rem .8rem;
    }

    .card.row .sku { margin: 0; }

    .card.row .title-row { margin: 0; }

    .card.row h2 {
      font-size: .98rem;
    }

    .card.row .prices.three {
      margin-top: .25rem;
      padding: 0;
      border: 0;
    }

    .meta-note {
      color: var(--muted);
      font-size: .8rem;
    }

    footer {
      padding: 2rem 1rem;
      background: var(--paper);
      border-top: 1px solid var(--line);
      color: var(--muted);
      text-align: center;
      font-size: .75rem;
      line-height: 1.6;
    }

    footer p { margin: 0; }
    footer p + p { margin-top: .45rem; }

    @media (max-width: 1050px) {
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      #official-catalog.grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 800px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 610px) {
      header { padding: 2.2rem 1rem 2rem; }
      .toolbar { grid-template-columns: 1fr 1fr; }
      .search-wrap { grid-column: 1 / -1; }
      .grid { grid-template-columns: 1fr; }
      .card h2 { min-height: 0; }
      .card.row { grid-template-columns: 6.5rem minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <div class="announcement" id="site-announcement">Official US prices · CAD via fixed FX</div>

  <header>
    <h1>My Jellycat Shelf</h1>
    <div class="header-stats" id="header-stats" aria-live="polite">
      <span class="header-stat">Loading…</span>
    </div>
  </header>

  <main>
    <div class="view-bar">
      <nav class="view-tabs" aria-label="Page sections">
        <button class="view-tab" type="button" data-view="official-view" aria-selected="true">Official listing</button>
        <button class="view-tab" type="button" data-view="stock-view" aria-selected="false">My stock</button>
      </nav>
      <button class="refresh-button" id="official-refresh" type="button" title="Refresh listings" aria-label="Refresh listings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.35M21 4v5h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>
      </button>
    </div>

    <section id="official-view">
      <label class="search-wrap" style="display:block;margin-bottom:1rem">
        <span hidden>Search official listings</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2"/></svg>
        <input id="official-search" type="search" placeholder="Search official listings…" autocomplete="off">
      </label>

      <nav class="category-nav" id="category-nav" aria-label="Listing filters"></nav>
      <nav class="profit-nav" id="profit-nav" aria-label="Profit price ranges"></nav>

      <p class="summary" aria-live="polite">
        <span><strong id="official-count">0</strong> listings</span>
      </p>

      <section class="grid" id="official-catalog" aria-label="Official Jellycat listings">
        <p class="empty">Loading official listings…</p>
      </section>
    </section>

    <section id="stock-view" hidden>
      <div class="toolbar" aria-label="Catalog controls">
        <label class="search-wrap">
          <span hidden>Search stock</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2"/></svg>
          <input id="search" type="search" placeholder="Search by name or SKU…" autocomplete="off">
        </label>

        <label>
          <span hidden>Filter by status</span>
          <select id="status">
            <option value="all">All status</option>
            <option value="in stock">In stock</option>
            <option value="sold">Sold</option>
            <option value="keep">Keep</option>
            <option value="not in stock">Not in stock</option>
          </select>
        </label>

        <a class="edit-link" href="https://docs.google.com/spreadsheets/d/1xr_M3_GrhcJzxosVEvrk6IhMysEDxpx1AeZ3_pa4vBk/edit?gid=419836162#gid=419836162" target="_blank" rel="noopener">Edit stock</a>
      </div>

      <p class="summary" aria-live="polite">
        <span><strong id="item-count">0</strong> designs</span>
        <span><strong id="unit-count">0</strong> total pieces</span>
      </p>

      <section class="grid" id="catalog" aria-label="Jellycat stock">
        <p class="empty">Loading the shelf…</p>
      </section>
    </section>
  </main>

  <button class="back-to-top" id="back-to-top" type="button" aria-label="Back to top" title="Back to top" hidden>↑</button>

  <footer>
    <p id="footer-meta">Catalog updating…</p>
    <p>Personal shelf for reference. Prices and images from the official US Jellycat site.</p>
  </footer>

  <script>
    const catalog = document.querySelector("#catalog");
    const search = document.querySelector("#search");
    const statusFilter = document.querySelector("#status");
    const backToTop = document.querySelector("#back-to-top");
    const officialCatalog = document.querySelector("#official-catalog");
    const officialSearch = document.querySelector("#official-search");
    const profitNav = document.querySelector("#profit-nav");
    const categoryNav = document.querySelector("#category-nav");
    const stockSources = [
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vR-cpq37DxcW9dhxC_-uTZgT8owPFsaiQ_GRYqi74LyY6glhL_Thc6oTMrFRfL96NtEYgJDUwEbSaz7/pub?output=csv",
      "stock.csv"
    ];
    let products = [];
    let officialProducts = [];
    let officialMeta = { fx: 1.41, markup: 1.2, updatedAt: null };
    let profitFilter = "all";
    let listFilter = "all";
    const NEW_LISTING_DAYS = 30;
    const SERIES_FILTERS = ["Amuseables", "Bashful", "Bartholomew", "Little", "Fuddlewuddle"];
    const CATEGORY_FILTERS = ["Animals", "Bag Charms"];
    const LIST_FILTERS = [
      ["all", "All"],
      ["new", `New (<${NEW_LISTING_DAYS}d)`],
      ["retired", "Retired"],
      ["Amuseables", "Amuseables"],
      ["Animals", "Animals"],
      ["Bag Charms", "Bag Charms"],
      ["Bashful", "Bashful"],
      ["Bartholomew", "Bartholomew"],
      ["Little", "Little"],
      ["Fuddlewuddle", "Fuddlewuddle"],
      ["Other", "Other"]
    ];
    const PROFIT_RANGES = [
      { id: "0-65", label: "$0–$65", min: 0, max: 65, exclusiveMin: false },
      { id: "65-100", label: "$65–$100", min: 65, max: 100, exclusiveMin: true },
      { id: "100+", label: ">$100", min: 100, max: Infinity, exclusiveMin: true }
    ];
    const SKIP_PRODUCT_RE = /\b(blankie|comforter|soother|rattle|musical\s*pull|personaliz(?:e|ed|ation)?|personalised?|book|board book)\b/i;

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let quoted = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (char === '"') {
          if (quoted && text[i + 1] === '"') {
            cell += '"';
            i++;
          } else {
            quoted = !quoted;
          }
        } else if (char === "," && !quoted) {
          row.push(cell);
          cell = "";
        } else if ((char === "\n" || char === "\r") && !quoted) {
          if (char === "\r" && text[i + 1] === "\n") i++;
          row.push(cell);
          if (row.some(value => value.trim())) rows.push(row);
          row = [];
          cell = "";
        } else {
          cell += char;
        }
      }

      row.push(cell);
      if (row.some(value => value.trim())) rows.push(row);

      const [headers, ...records] = rows;
      return records.map(values => Object.fromEntries(headers.map((header, i) => [header, values[i] ?? ""])));
    }

    function money(value, currency) {
      if (value === "" || value === null || value === undefined) return "Not listed";
      return new Intl.NumberFormat("en-CA", {
        style: "currency",
        currency,
        currencyDisplay: "code"
      }).format(Number(value));
    }

    function officialHref(product) {
      return product.official_url || `https://us.jellycat.com/search.php?search_query=${encodeURIComponent(product.name)}`;
    }

    function officialMark(product) {
      const link = document.createElement("a");
      link.className = "official-mark";
      link.href = officialHref(product);
      link.target = "_blank";
      link.rel = "noopener";
      link.title = "Official Jellycat product";
      link.setAttribute("aria-label", `Official Jellycat page for ${product.name}`);
      const logo = document.createElement("img");
      logo.src = "https://cdn11.bigcommerce.com/s-23s5gfmhr7/images/stencil/250x100/jellycat-logo-250x100_1713397226__60866.original.png";
      logo.alt = "Jellycat";
      logo.loading = "lazy";
      link.append(logo);
      return link;
    }

    function titleRow(product) {
      const row = document.createElement("div");
      row.className = "title-row";
      const name = document.createElement("h2");
      name.textContent = product.name;
      row.append(name, officialMark(product));
      return row;
    }

    function productCard(product) {
      const article = document.createElement("article");
      article.className = "card";

      const imageWrap = document.createElement("div");
      imageWrap.className = "image-wrap";

      // ponytail: name search can pick a variant; set image_url in the Sheet to override it.
      const imageUrl = product.image_url || `https://tse2.mm.bing.net/th?q=${encodeURIComponent(`Jellycat ${product.name}`)}&w=800&h=800&c=7&rs=1&p=0`;
      const image = document.createElement("img");
      image.src = imageUrl;
      image.alt = product.name;
      image.loading = "lazy";
      image.addEventListener("error", () => {
        const placeholder = document.createElement("div");
        placeholder.className = "image-placeholder";
        placeholder.textContent = "Picture not found";
        image.replaceWith(placeholder);
      }, { once: true });

      const badge = document.createElement("span");
      badge.className = `badge ${product.status.toLowerCase().replaceAll(" ", "-")}`;
      badge.textContent = `${product.status} · ${product.quantity}`;

      imageWrap.append(image, badge);

      const body = document.createElement("div");
      body.className = "card-body";

      const sku = document.createElement("p");
      sku.className = "sku";
      sku.textContent = `SKU ${product.sku}`;

      const prices = document.createElement("div");
      prices.className = "prices";

      const myPrice = document.createElement("div");
      const myLabel = document.createElement("span");
      myLabel.className = "price-label";
      myLabel.textContent = "My price";
      const myValue = document.createElement("span");
      myValue.className = "price";
      myValue.textContent = money(product.my_price_cad, "CAD");
      myPrice.append(myLabel, myValue);

      const officialPrice = document.createElement("div");
      const officialLabel = document.createElement("span");
      officialLabel.className = "price-label";
      officialLabel.textContent = "Official";
      const officialValue = document.createElement("span");
      officialValue.className = "price";
      officialValue.textContent = money(product.official_price_usd, "USD");
      officialPrice.append(officialLabel, officialValue);
      prices.append(myPrice, officialPrice);

      body.append(sku, titleRow(product), prices);
      article.append(imageWrap, body);
      return article;
    }

    function officialCard(product) {
      const article = document.createElement("article");
      article.className = "card row";

      const imageWrap = document.createElement("div");
      imageWrap.className = "image-wrap";
      const image = document.createElement("img");
      image.src = product.image_url;
      image.alt = product.name;
      image.loading = "lazy";
      image.addEventListener("error", () => {
        const placeholder = document.createElement("div");
        placeholder.className = "image-placeholder";
        placeholder.textContent = "Picture not found";
        image.replaceWith(placeholder);
      }, { once: true });
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = product.category;
      imageWrap.append(image, badge);
      if (product.retired) {
        const retired = document.createElement("span");
        retired.className = "badge retired";
        retired.textContent = "Retired";
        imageWrap.append(retired);
      }

      const body = document.createElement("div");
      body.className = "card-body";
      const sku = document.createElement("p");
      sku.className = "sku";
      sku.textContent = product.sku ? `SKU ${product.sku}` : "Official listing";

      const prices = document.createElement("div");
      prices.className = "prices three";
      for (const [label, value, currency] of [
        ["USD", product.official_price_usd, "USD"],
        ["CAD", product.official_price_cad, "CAD"],
        ["Sell", product.profit_price_cad, "CAD"]
      ]) {
        const block = document.createElement("div");
        block.className = "price-box";
        const title = document.createElement("span");
        title.className = "price-label";
        title.textContent = label;
        const amount = document.createElement("span");
        amount.className = "price";
        amount.textContent = money(value, currency);
        block.append(title, amount);
        prices.append(block);
      }

      body.append(sku, titleRow(product), prices);
      article.append(imageWrap, body);
      return article;
    }

    function render() {
      const query = search.value.trim().toLowerCase();
      const status = statusFilter.value;
      const visible = products.filter(product => {
        const matchesQuery = `${product.name} ${product.sku}`.toLowerCase().includes(query);
        const matchesStatus = status === "all" || product.status.toLowerCase() === status;
        return matchesQuery && matchesStatus;
      });

      catalog.replaceChildren();
      if (!visible.length) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "No Jellycats match that search.";
        catalog.append(empty);
      } else {
        catalog.append(...visible.map(productCard));
      }

      document.querySelector("#item-count").textContent = visible.length;
      document.querySelector("#unit-count").textContent = visible.reduce((sum, product) => sum + Number(product.quantity || 0), 0);
    }

    function renderChipNav(container, options, selected, onSelect, chipClass) {
      container.replaceChildren();
      for (const [value, label] of options) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = chipClass;
        button.dataset.value = value;
        button.textContent = label;
        button.setAttribute("aria-pressed", String(selected === value));
        button.addEventListener("click", () => onSelect(value));
        container.append(button);
      }
    }

    function isNewListing(product) {
      const added = Date.parse(product.added_at);
      if (!Number.isFinite(added)) return false;
      return Date.now() - added < NEW_LISTING_DAYS * 24 * 60 * 60 * 1000;
    }

    function shouldSkipProduct(product) {
      const blob = `${product.name || ""} ${product.sku || ""} ${product.official_url || ""}`;
      if (SKIP_PRODUCT_RE.test(blob)) return true;
      const sku = product.sku || "";
      return sku.startsWith("BK") || sku.startsWith("BB44") || sku.startsWith("SETBK") || sku.startsWith("SETBB");
    }

    function productSeries(product) {
      const name = product.name || "";
      return SERIES_FILTERS.find(series => name.startsWith(series)) || "Other";
    }

    function matchesListFilter(product) {
      if (listFilter === "all") return true;
      if (listFilter === "new") return isNewListing(product);
      if (listFilter === "retired") return Boolean(product.retired);
      if (CATEGORY_FILTERS.includes(listFilter)) {
        return product.category.split("|").map(part => part.trim()).includes(listFilter);
      }
      return productSeries(product) === listFilter;
    }

    function updateHeaderStats() {
      const root = document.querySelector("#header-stats");
      const stockUnits = products.reduce((sum, product) => sum + Number(product.quantity || 0), 0);
      const updated = officialMeta.updatedAt
        ? new Date(officialMeta.updatedAt).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })
        : "—";
      root.replaceChildren();
      for (const label of [
        `${officialProducts.length} official`,
        `${products.length} on shelf · ${stockUnits} units`,
        `Updated ${updated}`
      ]) {
        const chip = document.createElement("span");
        chip.className = "header-stat";
        chip.textContent = label;
        root.append(chip);
      }
      document.querySelector("#site-announcement").textContent =
        `Soft toys & bag charms · profit = CAD × ${officialMeta.markup}`;
    }

    function updateFooterMeta() {
      const updated = officialMeta.updatedAt
        ? new Date(officialMeta.updatedAt).toLocaleString()
        : "unknown";
      document.querySelector("#footer-meta").textContent =
        `Soft Toys, Animals, Bag Charms · last catalog update ${updated}.`;
    }

    function renderCategoryNav() {
      renderChipNav(categoryNav, LIST_FILTERS, listFilter, value => {
        listFilter = value;
        renderOfficial();
      }, "category-chip");
    }

    function renderProfitNav() {
      const options = [["all", "All prices"], ...PROFIT_RANGES.map(range => [range.id, range.label])];
      renderChipNav(profitNav, options, profitFilter, value => {
        profitFilter = value;
        renderOfficial();
      }, "profit-chip");
    }

    function renderOfficial() {
      const query = officialSearch.value.trim().toLowerCase();
      const range = PROFIT_RANGES.find(item => item.id === profitFilter);
      const visible = officialProducts.filter(product => {
        const matchesQuery = `${product.name} ${product.sku} ${product.category}`.toLowerCase().includes(query);
        const profit = Number(product.profit_price_cad);
        const matchesProfit = !range || (
          (range.exclusiveMin ? profit > range.min : profit >= range.min) &&
          profit <= range.max
        );
        return matchesQuery && matchesListFilter(product) && matchesProfit;
      });

      officialCatalog.replaceChildren();
      if (!visible.length) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "No official listings match that filter.";
        officialCatalog.append(empty);
      } else {
        officialCatalog.append(...visible.map(officialCard));
      }

      document.querySelector("#official-count").textContent = visible.length;
      for (const button of categoryNav.querySelectorAll(".category-chip")) {
        button.setAttribute("aria-pressed", String(button.dataset.value === listFilter));
      }
      for (const button of profitNav.querySelectorAll(".profit-chip")) {
        button.setAttribute("aria-pressed", String(button.dataset.value === profitFilter));
      }
      updateHeaderStats();
      updateFooterMeta();
    }

    function showView(viewId) {
      document.querySelector("#stock-view").hidden = viewId !== "stock-view";
      document.querySelector("#official-view").hidden = viewId !== "official-view";
      document.querySelector("#official-refresh").hidden = viewId !== "official-view";
      for (const tab of document.querySelectorAll(".view-tab")) {
        tab.setAttribute("aria-selected", String(tab.dataset.view === viewId));
      }
      history.replaceState(null, "", viewId === "official-view" ? "#official" : "#stock");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function loadStock() {
      for (const source of stockSources) {
        try {
          const separator = source.includes("?") ? "&" : "?";
          const response = await fetch(`${source}${separator}v=${Date.now()}`);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          products = parseCsv(await response.text());
          render();
          updateHeaderStats();
          return;
        } catch (error) {
          console.error(`Could not load ${source}`, error);
        }
      }
      catalog.innerHTML = '<p class="error">Could not load the Google Sheet or backup stock.csv.</p>';
    }

    async function loadOfficial() {
      try {
        const response = await fetch(`official-catalog.json?v=${Date.now()}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        officialProducts = (data.products || []).filter(product => !shouldSkipProduct(product));
        officialMeta = {
          fx: data.fx_usd_to_cad ?? 1.41,
          markup: data.profit_markup ?? 1.2,
          updatedAt: data.updated_at
        };
        profitFilter = "all";
        listFilter = "all";
        renderCategoryNav();
        renderProfitNav();
        renderOfficial();
      } catch (error) {
        officialCatalog.innerHTML = '<p class="error">Could not load official-catalog.json.</p>';
        console.error(error);
      }
    }

    search.addEventListener("input", render);
    statusFilter.addEventListener("change", render);
    officialSearch.addEventListener("input", renderOfficial);
    for (const tab of document.querySelectorAll(".view-tab")) {
      tab.addEventListener("click", () => showView(tab.dataset.view));
    }
    document.querySelector("#official-refresh").addEventListener("click", async () => {
      const button = document.querySelector("#official-refresh");
      button.disabled = true;
      button.classList.add("is-busy");
      await loadOfficial();
      button.disabled = false;
      button.classList.remove("is-busy");
    });
    window.addEventListener("scroll", () => {
      backToTop.hidden = window.scrollY < 500;
    }, { passive: true });
    backToTop.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    if (location.hash === "#stock") showView("stock-view");
    else showView("official-view");
    loadStock();
    loadOfficial();
  </script>
</body>
</html>
